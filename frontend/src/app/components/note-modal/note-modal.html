<div class="modal modal-open backdrop-blur-sm bg-black/60">
  <div
    class="modal-box w-11/12 max-w-5xl max-h-[92vh] flex flex-col p-0 overflow-hidden bg-transparent shadow-2xl rounded-3xl">
    <!-- Glass Container -->
    <div
      class="glass-panel h-full w-full flex flex-col relative overflow-hidden bg-[#1a1a1a]/90 backdrop-blur-xl border border-white/10">
      <!-- Decorative Header Gradient -->
      <div
        class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary/50 via-secondary/50 to-primary/50 opacity-50">
      </div>

      <!-- Header -->
      <div class="px-6 py-4 border-b border-white/5 flex items-center justify-between bg-white/5">
        <div class="flex items-center gap-3">
          <div class="p-2 rounded-xl bg-primary/10 text-primary text-xl">
            {{ getNoteTypeIcon() }}
          </div>
          <div>
            <h3 class="font-bold text-lg text-white tracking-tight">{{ isReadOnly ? 'View Note' : 'Edit Note' }}</h3>
            <p class="text-xs text-base-content/60">{{ getNoteTypeLabel() }}</p>
          </div>
        </div>
        <button (click)="onClose()"
          class="btn btn-circle btn-ghost btn-sm text-base-content/50 hover:text-white hover:bg-white/10">
          <ng-icon name="heroXMark" size="1.5rem"></ng-icon>
        </button>
      </div>

      <!-- Form Content -->
      <form [formGroup]="noteForm" (ngSubmit)="onSubmit()" class="flex-1 flex flex-col overflow-hidden">

        <div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-4">
          <!-- Controls Row -->
          @if (!isReadOnly) {
          <div class="flex flex-wrap items-center gap-4 p-3 rounded-2xl bg-base-200/20 border border-white/5">
            <!-- Note Type Buttons -->
            <div class="flex gap-2">
              <button type="button" class="btn btn-sm gap-2 transition-all duration-200"
                [class.btn-primary]="noteForm.value.noteType === 'general'"
                [class.btn-ghost]="noteForm.value.noteType !== 'general'"
                [class.bg-white/5]="noteForm.value.noteType !== 'general'"
                (click)="noteForm.patchValue({ noteType: 'general' })">
                <span class="text-base">📝</span>
                <span class="text-xs font-normal">General</span>
              </button>
              <button type="button" class="btn btn-sm gap-2 transition-all duration-200"
                [class.btn-primary]="noteForm.value.noteType === 'quote'"
                [class.btn-ghost]="noteForm.value.noteType !== 'quote'"
                [class.bg-white/5]="noteForm.value.noteType !== 'quote'"
                (click)="noteForm.patchValue({ noteType: 'quote' })">
                <span class="text-base">💬</span>
                <span class="text-xs font-normal">Quote</span>
              </button>
              <button type="button" class="btn btn-sm gap-2 transition-all duration-200"
                [class.btn-primary]="noteForm.value.noteType === 'thought'"
                [class.btn-ghost]="noteForm.value.noteType !== 'thought'"
                [class.bg-white/5]="noteForm.value.noteType !== 'thought'"
                (click)="noteForm.patchValue({ noteType: 'thought' })">
                <span class="text-base">💭</span>
                <span class="text-xs font-normal">Thought</span>
              </button>
              <button type="button" class="btn btn-sm gap-2 transition-all duration-200"
                [class.btn-primary]="noteForm.value.noteType === 'question'"
                [class.btn-ghost]="noteForm.value.noteType !== 'question'"
                [class.bg-white/5]="noteForm.value.noteType !== 'question'"
                (click)="noteForm.patchValue({ noteType: 'question' })">
                <span class="text-base">❓</span>
                <span class="text-xs font-normal">Question</span>
              </button>
            </div>

            <div class="w-px h-6 bg-white/10 mx-2"></div>

            <!-- Page Number Input -->
            <div class="flex items-center gap-2">
              <ng-icon name="heroBookOpen" size="1rem" class="text-base-content/60"></ng-icon>
              <input type="number" formControlName="pageNumber"
                class="input input-sm input-bordered w-24 bg-base-200/30 border-white/10 focus:border-primary/50 text-center"
                placeholder="Page #" min="1">
            </div>
          </div>
          }

          <!-- Rich Text Editor -->
          <div class="form-control flex-1 flex flex-col min-h-0 relative">
            @if (!isReadOnly) {
            <div
              class="rounded-2xl border border-white/10 flex-1 flex flex-col overflow-hidden bg-base-200/10 focus-within:border-primary/50 focus-within:bg-base-200/20 transition-all duration-300">
              <quill-editor formControlName="summary" [modules]="quillConfig"
                [styles]="{'height': '100%', 'display': 'flex', 'flex-direction': 'column', 'border': 'none'}"
                placeholder="Write your note here... You can use formatting options above.">
              </quill-editor>
            </div>
            }

            @if (isReadOnly) {
            <div
              class="rounded-2xl border border-white/10 p-6 prose prose-invert max-w-none flex-1 overflow-y-auto bg-base-200/10"
              [innerHTML]="noteForm.value.summary">
            </div>
            }
          </div>
        </div>

        <!-- Footer Actions -->
        <div class="border-t border-white/5 px-6 py-4 bg-white/5">
          <div class="flex justify-end gap-3">
            <button type="button" (click)="onClose()"
              class="btn btn-ghost hover:bg-white/5 text-base-content/70 hover:text-white rounded-xl px-6">
              {{ isReadOnly ? 'Close' : 'Cancel' }}
            </button>
            @if (!isReadOnly) {
            <button type="submit" [disabled]="noteForm.invalid"
              class="btn btn-primary text-white rounded-xl px-8 shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:shadow-none gap-2">
              <ng-icon name="heroCheckCircle" size="1.25rem"></ng-icon>
              Save Note
            </button>
            }
          </div>
        </div>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop backdrop-blur-sm">
    <button (click)="onClose()">close</button>
  </form>
</div>
