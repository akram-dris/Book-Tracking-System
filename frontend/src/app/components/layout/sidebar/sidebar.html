<aside [class.w-14]="isCollapsed()" [class.w-52]="!isCollapsed()"
  class="glass-float flex flex-col h-[calc(100vh-1rem)] my-2 ml-2 rounded-2xl transition-all duration-500 ease-[cubic-bezier(0.23,1,0.32,1)] relative z-50">

  <!-- Header -->
  <div class="flex items-center justify-center h-16 shrink-0 relative overflow-hidden">
    <a routerLink="/" class="flex items-center gap-3 transition-all duration-300" [class.w-full]="!isCollapsed()"
      [class.px-4]="!isCollapsed()" [class.justify-center]="isCollapsed()">
      <div
        class="w-8 h-8 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20 shrink-0 transition-all duration-500 z-10"
        [class.scale-110]="isCollapsed()" [class.rotate-3]="isCollapsed()">
        <ng-icon name="heroBookOpen" size="1.1rem" class="text-white"></ng-icon>
      </div>
      <span
        class="text-lg font-heading font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent whitespace-nowrap transition-all duration-300 origin-left absolute left-16"
        [class.opacity-0]="isCollapsed()" [class.translate-x-[-20px]]="isCollapsed()">
        BookTrack
      </span>
    </a>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-2 custom-scrollbar" [class.overflow-y-auto]="!isCollapsed()"
    [class.overflow-visible]="isCollapsed()">
    <ul class="space-y-1.5">
      @for (item of navItems; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active-nav-item" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.exactMatch ?? false }"
          class="flex items-center h-9 rounded-xl transition-all duration-300 group hover:bg-base-content/5 relative"
          [class.justify-center]="isCollapsed()" [class.px-3]="!isCollapsed()">

          <!-- Active Indicator Background -->
          <div
            class="absolute inset-0 bg-gradient-to-r from-primary/10 to-transparent opacity-0 transition-opacity duration-300 active-indicator rounded-xl">
          </div>

          <!-- Icon -->
          <ng-icon [name]="item.icon" size="1.1rem"
            class="transition-colors duration-300 group-hover:text-primary z-10 shrink-0"
            [class.text-primary]="rla.isActive">
          </ng-icon>

          <!-- Label (Animated) -->
          <span
            class="font-medium text-sm z-10 whitespace-nowrap overflow-hidden transition-all duration-300 origin-left ml-3"
            [class.w-0]="isCollapsed()" [class.opacity-0]="isCollapsed()" [class.ml-0]="isCollapsed()">
            {{ item.label }}
          </span>

          <!-- Tooltip -->
          @if (isCollapsed()) {
          <div
            class="absolute left-full ml-4 px-3 py-1.5 bg-base-content/90 backdrop-blur text-base-100 text-xs font-medium rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-200 translate-x-[-10px] group-hover:translate-x-0 pointer-events-none whitespace-nowrap z-[100] shadow-xl">
            {{ item.label }}
            <!-- Arrow -->
            <div
              class="absolute top-1/2 right-full -translate-y-1/2 border-4 border-transparent border-r-base-content/90">
            </div>
          </div>
          }

          <!-- Active Glow Pill (Right Side) -->
          <div
            class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-5 bg-primary rounded-l-full opacity-0 transition-all duration-300 active-pill">
          </div>
        </a>
      </li>
      }
    </ul>
  </nav>

  <!-- Toggle Button (Footer) -->
  <div class="p-2 shrink-0">
    <button (click)="onToggle()"
      class="btn btn-ghost w-full hover:bg-base-content/5 border border-transparent hover:border-base-content/10 transition-all duration-300 group relative overflow-hidden flex items-center"
      [class.btn-circle]="isCollapsed()" [class.justify-center]="isCollapsed()" [class.h-9]="!isCollapsed()"
      [class.min-h-0]="!isCollapsed()" [class.rounded-xl]="!isCollapsed()">

      <!-- Icon -->
      <ng-icon [name]="isCollapsed() ? 'heroBars3' : 'heroBars3BottomLeft'" size="1.1rem"
        class="transition-transform duration-500 group-hover:scale-110 text-base-content shrink-0"
        [class.rotate-180]="!isCollapsed()"></ng-icon>

      <!-- Text -->
      <span class="text-sm font-medium whitespace-nowrap transition-all duration-300 origin-left"
        [class.w-0]="isCollapsed()" [class.opacity-0]="isCollapsed()" [class.ml-3]="!isCollapsed()"
        [class.ml-0]="isCollapsed()">
        Collapse
      </span>
    </button>
  </div>
</aside>

<style>
  .active-nav-item .active-indicator {
    opacity: 1;
  }

  .active-nav-item ng-icon {
    color: hsl(var(--p));
    filter: drop-shadow(0 0 8px hsl(var(--p) / 0.5));
  }

  .active-nav-item span {
    color: hsl(var(--p));
    font-weight: 600;
  }

  .active-nav-item .active-pill {
    opacity: 1;
    box-shadow: 0 0 10px hsl(var(--p));
  }
</style>
