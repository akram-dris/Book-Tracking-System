<div class="glass-panel p-4 rounded-xl shadow-lg flex items-start gap-3 min-w-[320px] max-w-[400px] animate-slide-in relative overflow-hidden group border-l-4"
    [ngClass]="{
       'border-l-success': toast.type === 'success',
       'border-l-error': toast.type === 'error',
       'border-l-warning': toast.type === 'warning',
       'border-l-info': toast.type === 'info'
     }">

    <!-- Glow Effect -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" [ngClass]="{
         'bg-success': toast.type === 'success',
         'bg-error': toast.type === 'error',
         'bg-warning': toast.type === 'warning',
         'bg-info': toast.type === 'info'
       }"></div>

    <!-- Icon -->
    <div class="mt-0.5" [ngClass]="typeClass">
        <ng-icon [name]="icon" size="24"></ng-icon>
    </div>

    <!-- Content -->
    <div class="flex-1">
        <h4 class="font-bold text-sm mb-0.5" [ngClass]="typeClass">{{ toast.title }}</h4>
        <p class="text-sm opacity-90">{{ toast.message }}</p>
    </div>

    <!-- Close Button -->
    <button (click)="close.emit()" class="text-base-content/50 hover:text-base-content transition-colors">
        <ng-icon name="heroXMark" size="20"></ng-icon>
    </button>
</div>
