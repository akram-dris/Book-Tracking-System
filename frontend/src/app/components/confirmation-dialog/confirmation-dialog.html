<div
    class="glass-panel relative overflow-hidden rounded-2xl border border-white/10 bg-gray-900/90 p-6 shadow-2xl backdrop-blur-xl">
    <!-- Glow Effects -->
    <div class="absolute -top-20 -right-20 h-40 w-40 rounded-full bg-primary/20 blur-3xl"></div>
    <div class="absolute -bottom-20 -left-20 h-40 w-40 rounded-full bg-secondary/20 blur-3xl"></div>

    <!-- Icon & Title -->
    <div class="relative z-10 mb-6 flex items-center gap-4">
        <div
            class="flex h-12 w-12 items-center justify-center rounded-full bg-red-500/20 text-red-400 shadow-lg shadow-red-500/10 ring-1 ring-red-500/30">
            <ng-icon name="heroExclamationTriangle" class="text-2xl"></ng-icon>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">{{ data.title }}</h2>
    </div>

    <!-- Content -->
    <div class="relative z-10 mb-8">
        <p class="text-gray-300 leading-relaxed">{{ data.message }}</p>
    </div>

    <!-- Actions -->
    <div class="relative z-10 flex justify-end gap-3">
        <button mat-button [mat-dialog-close]="false"
            class="px-6 py-2.5 rounded-xl !text-white hover:bg-white/5 hover:!text-white transition-all duration-300 border border-transparent hover:border-white/10">
            {{ data.cancelText || 'Cancel' }}
        </button>

        <button mat-flat-button [color]="data.confirmColor || 'warn'" [mat-dialog-close]="true"
            class="px-6 py-2.5 rounded-xl shadow-lg shadow-red-500/20 hover:shadow-red-500/40 transition-all duration-300 !bg-red-500 hover:!bg-red-600 text-white font-medium tracking-wide">
            {{ data.confirmText || 'Confirm' }}
        </button>
    </div>
</div>
